name: Deploy demo

on:
  workflow_dispatch:
    inputs:
      clear_two_factor:
        description: Delete every 2FA enrollment and remembered device in the demo D1
        type: boolean
        default: false
      diagnose_email:
        description: Query passkey PRF state for this email without changing data
        type: string
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only the production environment holds Cloudflare credentials. This job
    # deploys the isolated warden-worker-demo Worker and its own D1; it reuses
    # the production backup/TOTP keys so real backups can be restored here.
    environment: production
    env:
      DEMO_WORKER_NAME: warden-worker-demo
      DEMO_D1_NAME: warden-worker-demo-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install worker-build
        run: cargo install worker-build@0.8.7 --locked
      - name: Verify versions
        run: ./scripts/verify-version.sh
      - name: Install Wrangler
        run: npm install --global wrangler@4.114.0
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32
      - name: Ensure demo D1 exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?name=$DEMO_D1_NAME" > /tmp/d1-list.json
          id=$(jq -r --arg name "$DEMO_D1_NAME" '.result[]? | select(.name == $name) | .uuid' /tmp/d1-list.json | head -1)
          if [ -z "$id" ]; then
            curl -sf -X POST "$api" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$DEMO_D1_NAME\"}" > /tmp/d1-create.json
            id=$(jq -r '.result.uuid // empty' /tmp/d1-create.json)
          fi
          test -n "$id" || { echo "Could not resolve demo D1 id"; exit 1; }
          {
            echo "D1_DATABASE_ID=$id"
            echo "D1_DATABASE_NAME=$DEMO_D1_NAME"
          } >> "$GITHUB_ENV"
          {
            echo "## Demo resources"
            echo "- Worker: \`$DEMO_WORKER_NAME\`"
            echo "- D1: \`$DEMO_D1_NAME\` (\`$id\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Render deployment config
        env:
          WORKER_NAME: ${{ env.DEMO_WORKER_NAME }}
          D1_DATABASE_NAME: ${{ env.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          node scripts/render-wrangler-config.mjs wrangler.deploy.template.jsonc wrangler.demo.jsonc
          # The demo relies on manual backup/restore; its Cloudflare token cannot
          # update Cron Triggers, and the shared template always carries one.
          sed -i '/"triggers":/d' wrangler.demo.jsonc
      - name: Diagnose passkey PRF state
        if: ${{ inputs.diagnose_email != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_EMAIL: ${{ inputs.diagnose_email }}
        run: |
          set -euo pipefail
          email=$(printf '%s' "$TARGET_EMAIL" | tr '[:upper:]' '[:lower:]')
          case "$email" in
            ''|*[!a-z0-9_.@+-]*) echo "Invalid email"; exit 1 ;;
          esac
          for name in warden-sql warden-worker-demo-db; do
            id=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$name" \
              | jq -r --arg name "$name" '.result[]? | select(.name == $name) | .uuid' | head -1)
            if [ -z "$id" ]; then
              echo "DB $name: not found"
              continue
            fi
            echo "DB $name ($id)"
            sql="SELECT u.id AS user_id, u.email, u.created_at AS user_created, w.id AS credential_row, w.name AS credential_name, w.prf_status, w.encrypted_user_key IS NOT NULL AS has_user_key, w.encrypted_public_key IS NOT NULL AS has_public_key, w.encrypted_private_key IS NOT NULL AS has_private_key, w.created_at AS credential_created FROM users u LEFT JOIN webauthn_credentials w ON w.user_id = u.id WHERE lower(u.email) = lower(?1)"
            jq -n --arg sql "$sql" --arg email "$email" '{sql: $sql, params: [$email]}' \
              | curl -sf -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                  --data @- "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$id/query" \
              | jq -c '.result[0].results // .errors'
          done
      - name: Initialize demo database if empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 execute vault1 --remote --config wrangler.demo.jsonc \
            --command "SELECT COUNT(1) AS tables FROM sqlite_master WHERE type = 'table' AND name = 'users'" \
            --json > /tmp/demo-d1-state.json
          initialized=$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('/tmp/demo-d1-state.json','utf8'));const row=data&&data[0]&&data[0].results&&data[0].results[0];process.stdout.write(String(row?row.tables:0))")
          if [ "$initialized" = "1" ]; then
            # schema_full.sql is authoritative for the demo database; its
            # columns already include every migration, so re-applying them
            # would fail with duplicate column errors.
            echo "Demo D1 already initialized; skipping migrations."
          else
            echo "Demo D1 is empty; applying schema_full.sql."
            wrangler d1 execute vault1 --remote --config wrangler.demo.jsonc --file sql/schema_full.sql
          fi
          # Idempotent, so existing demo databases also gain the WebAuthn tables.
          wrangler d1 execute vault1 --remote --config wrangler.demo.jsonc \
            --file sql/migrations/20261116_add_webauthn.sql
      - name: Clear demo two-factor state
        if: ${{ inputs.clear_two_factor }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 execute vault1 --remote --config wrangler.demo.jsonc \
            --command "DELETE FROM two_factor_authenticator; DELETE FROM two_factor_webauthn; DELETE FROM webauthn_challenges; UPDATE users SET totp_recover = NULL; UPDATE devices SET remember_token_hash = NULL, remember_expires_at = NULL;"
          echo "Demo 2FA enrollments and passkey 2FA keys cleared" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy demo Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.demo.jsonc 2>&1 | tee /tmp/deploy.log
      - name: Sync demo Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          SIGNUPS_ALLOWED: ${{ vars.SIGNUPS_ALLOWED || 'true' }}
          PRODUCTION_BACKUP_ENC_KEY: ${{ secrets.WORKER_BACKUP_ENC_KEY }}
          PRODUCTION_TWO_FACTOR_ENC_KEY: ${{ secrets.WORKER_TWO_FACTOR_ENC_KEY }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "Missing ADMIN_EMAIL environment variable"; exit 1; }
          existing=$(wrangler secret list --config wrangler.demo.jsonc --format json 2>/dev/null || echo '[]')
          has_secret() { printf '%s' "$existing" | jq -e --arg name "$1" 'map(.name) | index($name)' > /dev/null; }
          for name in JWT_SECRET JWT_REFRESH_SECRET; do
            if has_secret "$name"; then echo "$name already configured"; else
              openssl rand -base64 48 | wrangler secret put "$name" --config wrangler.demo.jsonc
            fi
          done
          if [ -n "$PRODUCTION_TWO_FACTOR_ENC_KEY" ]; then
            printf '%s' "$PRODUCTION_TWO_FACTOR_ENC_KEY" | wrangler secret put TWO_FACTOR_ENC_KEY --config wrangler.demo.jsonc
          else
            echo "::warning::WORKER_TWO_FACTOR_ENC_KEY is not set in GitHub Secrets; demo TOTP secrets will not match production backups."
            if ! has_secret TWO_FACTOR_ENC_KEY; then
              openssl rand -base64 32 | wrangler secret put TWO_FACTOR_ENC_KEY --config wrangler.demo.jsonc
            fi
          fi
          if [ -n "$PRODUCTION_BACKUP_ENC_KEY" ]; then
            printf '%s' "$PRODUCTION_BACKUP_ENC_KEY" | wrangler secret put BACKUP_ENC_KEY --config wrangler.demo.jsonc
          else
            echo "::warning::WORKER_BACKUP_ENC_KEY is not set in GitHub Secrets; demo backups cannot be restored on production."
            if ! has_secret BACKUP_ENC_KEY; then
              openssl rand -base64 32 | wrangler secret put BACKUP_ENC_KEY --config wrangler.demo.jsonc
            fi
          fi
          printf '%s' "$ADMIN_EMAIL" | wrangler secret put ADMIN_EMAIL --config wrangler.demo.jsonc
          printf '%s' "$SIGNUPS_ALLOWED" | wrangler secret put SIGNUPS_ALLOWED --config wrangler.demo.jsonc
      - name: Report demo URL and smoke test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            subdomain=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
            url="https://$DEMO_WORKER_NAME.$subdomain.workers.dev"
          fi
          echo "Demo URL: $url" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --retry 5 --retry-connrefused --retry-delay 3 "$url/api/alive"
          curl -fsS --retry 5 --retry-connrefused --retry-delay 3 "$url/api/version"
          curl -fsS --retry 5 --retry-connrefused --retry-delay 3 "$url/api/config" > /dev/null
          curl -fsS --retry 5 --retry-connrefused --retry-delay 3 \
            "$url/identity/accounts/webauthn/assertion-options" \
            | jq -e '.options.challenge and .token' > /dev/null
          status=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/webauthn")
          test "$status" = "401" || { echo "Expected 401 from /api/webauthn, got $status"; exit 1; }
          echo "Smoke test passed for $url (including WebAuthn options)" >> "$GITHUB_STEP_SUMMARY"
