name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install worker-build
        run: cargo install worker-build --locked
      - name: Verify versions
        run: ./scripts/verify-version.sh
      - name: Build Worker
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        run: worker-build --release
      - name: Install Wrangler
        run: npm install --global wrangler@4.114.0
      - name: Render deployment config
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME || 'warden-worker' }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/render-wrangler-config.mjs wrangler.deploy.template.jsonc wrangler.deploy.generated.jsonc
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing production secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing production secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32 || { echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character account ID"; exit 1; }
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply vault1 --remote --config wrangler.deploy.generated.jsonc
      - name: Sync Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.WORKER_JWT_REFRESH_SECRET }}
          TWO_FACTOR_ENC_KEY: ${{ secrets.WORKER_TWO_FACTOR_ENC_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          SIGNUPS_ALLOWED: ${{ vars.SIGNUPS_ALLOWED || 'false' }}
        run: |
          set -euo pipefail
          sync_secret() { test -n "${!1:-}" || { echo "Missing Worker secret/value: $1"; exit 1; }; printf '%s' "${!1}" | wrangler secret put "$2" --config wrangler.deploy.generated.jsonc; }
          sync_secret JWT_SECRET JWT_SECRET
          sync_secret JWT_REFRESH_SECRET JWT_REFRESH_SECRET
          sync_secret TWO_FACTOR_ENC_KEY TWO_FACTOR_ENC_KEY
          sync_secret ADMIN_EMAIL ADMIN_EMAIL
          sync_secret SIGNUPS_ALLOWED SIGNUPS_ALLOWED
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        run: wrangler deploy --config wrangler.deploy.generated.jsonc
      - name: Smoke test
        env:
          PRODUCTION_BASE_URL: ${{ vars.BASE_URL }}
        if: ${{ env.PRODUCTION_BASE_URL != '' }}
        run: ./scripts/smoke-test.sh "$PRODUCTION_BASE_URL"
